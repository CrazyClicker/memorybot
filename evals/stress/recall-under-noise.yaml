# Opt-in: excluded from --all. Fixed human-handled distractors avoid paid agent/judge turns.
# Compare consolidate configs only; see evals/EXPERIMENTS.md.
id: recall-under-noise
title: Recall an older customer constraint after unrelated catalogue tickets exceed the transcript budget
tags:
  - stress
  - memory:personal
  - retrieval
  - opt-in
hypotheses:
  - id: retention-under-budget
    claim: Selective memory preserves an older delivery constraint beyond the bounded transcript baseline.
    comparison: Run naive and structured engines at read=hydrate, write=consolidate. This is an engine
      stress test; agent-only does not ingest the intervening human-handled tickets.
    decision_rule: Require the region-specific later answer and isolation. Verify observed recall tokens
      and missing old-source ids; mem0 has a different topK budget, so do not claim an equal-token
      advantage for it.
    evidence:
      - owner: later-agent
        key: uses:K1
      - owner: later-agent
        key: reply.rubric
      - owner: isolation
        key: must_not_recall:K1
