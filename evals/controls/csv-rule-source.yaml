  - id: branch-name-open
    type: customer_message
    thread: tkt_dom_i_sad_branch_name
    customer: dom_i_sad
    at: 2026-09-01T09:10:00Z
    content: |
      «Дом и сад». Уточняем поведение версии импортёра до релиза 10 сентября,
      пока ничего не загружаем. Выбран режим «Только новые», но из-за BOM
      заголовок sku не распознан. Название строки совпадает с существующим
      товаром, в файле указана другая цена. Обновится ли цена существующего
      товара при выбранном режиме? Почему?
  - id: branch-name-agent
    type: agent_turn
    thread: tkt_dom_i_sad_branch_name
    expect:
      outcome: answer
      reply:
        rubric: "Pass: explicitly says the existing product's price WILL be updated: when BOM prevents
          recognition of the sku header, the importer ignores Only new mode, matches by title and
          updates the existing product, including its price. Partial: warns that the price may
          change without asserting this branch or explaining the ignored mode and title fallback.
          Fail: promises protection because of Only new mode, says every unrecognised-sku row is
          skipped, predicts a duplicate new product, or substitutes advice to remove BOM for the
          requested answer."
  - id: branch-new-context
    type: customer_message
    thread: tkt_dom_i_sad_branch_new
    customer: dom_i_sad
    at: 2026-09-01T09:20:00Z
    content: «Дом и сад». Хотим уточнить правило работы импортёра перед новой загрузкой. Текущих проблем
